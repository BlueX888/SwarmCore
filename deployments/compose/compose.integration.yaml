name: swarmcore-integration

services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: swarmcore_test
      POSTGRES_USER: swarmcore
      POSTGRES_PASSWORD: swarmcore
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarmcore -d swarmcore_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  temporal:
    image: temporalio/auto-setup:1.28.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: swarmcore
      POSTGRES_PWD: swarmcore
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "17233:7233"
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 2s
      timeout: 5s
      retries: 150
      start_period: 15s
