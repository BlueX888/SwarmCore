[project]
name = "swarmcore-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "jsonschema==4.25.0",
  "pydantic-settings==2.14.2",
  "PyJWT[crypto]==2.10.1",
  "swarmcore-application",
  "swarmcore-compiler",
  "swarmcore-domain",
  "swarmcore-observability",
  "swarmcore-persistence",
  "swarmcore-registry",
  "swarmcore-spec",
  "swarmcore-governance",
  "swarmcore-capability-contract-integrity",
  "swarmcore-capability-contract-post-evaluation",
  "swarmcore-capability-deviation-analysis",
  "swarmcore-capability-invoice-assurance",
  "uvicorn[standard]==0.35.0",
]

[project.scripts]
swarmcore-api = "swarmcore_api.main:run"
swarmcore-seed = "swarmcore_api.seed:run"

[tool.uv.sources]
swarmcore-application = { workspace = true }
swarmcore-compiler = { workspace = true }
swarmcore-domain = { workspace = true }
swarmcore-observability = { workspace = true }
swarmcore-persistence = { workspace = true }
swarmcore-registry = { workspace = true }
swarmcore-spec = { workspace = true }
swarmcore-governance = { workspace = true }
swarmcore-capability-contract-integrity = { workspace = true }
swarmcore-capability-contract-post-evaluation = { workspace = true }
swarmcore-capability-deviation-analysis = { workspace = true }
swarmcore-capability-invoice-assurance = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
