[project]
name = "swarmcore"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv.workspace]
members = [
  "packages/application",
  "apps/api",
  "apps/command-dispatcher",
  "apps/worker-control",
  "apps/worker-agent",
  "apps/event-publisher",
  "apps/projection-reconciler",
  "apps/worker-tool",
  "apps/tool-gateway",
  "apps/worker-webhook",
  "apps/sandbox-manager",
  "apps/artifact-gateway",
  "apps/model-gateway",
  "packages/spec",
  "packages/compiler",
  "packages/domain",
  "packages/persistence",
  "packages/runtime-temporal",
  "packages/adapter-agno",
  "packages/observability",
  "packages/registry",
  "packages/tool-gateway",
  "packages/governance",
  "packages/capability-contract-integrity",
  "packages/capability-contract-post-evaluation",
  "packages/capability-deviation-analysis",
  "packages/capability-invoice-assurance",
]

[dependency-groups]
dev = [
  "boto3==1.40.1",
  "mypy==1.17.0",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "pytest-cov==6.2.1",
  "ruff==0.12.3",
  "types-jsonschema==4.25.0.20250720",
  "types-PyYAML==6.0.12.20250516",
  "types-reportlab>=4.5.1.20260724",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = [
  "packages/application/src",
  "packages/spec/src",
  "packages/compiler/src",
  "packages/domain/src",
  "packages/persistence/src",
  "packages/runtime-temporal/src",
  "packages/adapter-agno/src",
  "apps/api/src",
  "apps/command-dispatcher/src",
  "apps/worker-control/src",
  "apps/worker-agent/src",
  "apps/event-publisher/src",
  "apps/projection-reconciler/src",
  "apps/worker-tool/src",
  "apps/tool-gateway/src",
  "apps/worker-webhook/src",
  "apps/sandbox-manager/src",
  "apps/artifact-gateway/src",
  "apps/model-gateway/src",
  "packages/observability/src",
  "packages/registry/src",
  "packages/tool-gateway/src",
  "packages/governance/src",
  "packages/capability-contract-integrity/src",
  "packages/capability-contract-post-evaluation/src",
  "packages/capability-deviation-analysis/src",
  "packages/capability-invoice-assurance/src",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = [
  "swarmcore_application",
  "swarmcore_spec",
  "swarmcore_compiler",
  "swarmcore_domain",
  "swarmcore_persistence",
  "swarmcore_runtime_temporal",
  "swarmcore_adapter_agno",
  "swarmcore_api",
  "swarmcore_command_dispatcher",
  "swarmcore_worker_control",
  "swarmcore_worker_agent",
  "swarmcore_event_publisher",
  "swarmcore_projection_reconciler",
  "swarmcore_worker_tool",
  "swarmcore_tool_gateway_api",
  "swarmcore_worker_webhook",
  "swarmcore_sandbox_manager",
  "swarmcore_artifact_gateway",
  "swarmcore_model_gateway",
  "swarmcore_observability",
  "swarmcore_registry",
  "swarmcore_tool_gateway",
  "swarmcore_governance",
  "swarmcore_capability_contract_integrity",
  "swarmcore_capability_contract_post_evaluation",
  "swarmcore_capability_deviation_analysis",
]
mypy_path = [
  "packages/application/src",
  "packages/spec/src",
  "packages/compiler/src",
  "packages/domain/src",
  "packages/persistence/src",
  "packages/runtime-temporal/src",
  "packages/adapter-agno/src",
  "apps/api/src",
  "apps/command-dispatcher/src",
  "apps/worker-control/src",
  "apps/worker-agent/src",
  "apps/event-publisher/src",
  "apps/projection-reconciler/src",
  "apps/worker-tool/src",
  "apps/tool-gateway/src",
  "apps/worker-webhook/src",
  "apps/sandbox-manager/src",
  "apps/artifact-gateway/src",
  "apps/model-gateway/src",
  "packages/observability/src",
  "packages/registry/src",
  "packages/tool-gateway/src",
  "packages/governance/src",
  "packages/capability-contract-integrity/src",
  "packages/capability-contract-post-evaluation/src",
  "packages/capability-deviation-analysis/src",
  "packages/capability-invoice-assurance/src",
]
