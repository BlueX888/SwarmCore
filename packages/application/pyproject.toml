[project]
name = "swarmcore-application"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema==4.25.0",
  "pydantic==2.11.7",
  "swarmcore-compiler",
  "swarmcore-domain",
  "swarmcore-persistence",
  "swarmcore-registry",
  "swarmcore-spec",
]

[tool.uv.sources]
swarmcore-compiler = { workspace = true }
swarmcore-domain = { workspace = true }
swarmcore-persistence = { workspace = true }
swarmcore-registry = { workspace = true }
swarmcore-spec = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
