[project]
name = "swarmcore-compiler"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema==4.25.0",
  "pydantic==2.11.7",
  "swarmcore-spec",
]

[tool.uv.sources]
swarmcore-spec = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

