name: swarmcore

services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: swarmcore
      POSTGRES_USER: swarmcore
      POSTGRES_PASSWORD: swarmcore
    ports:
      # Host 5432 is often occupied by a local PostgreSQL install on Windows.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarmcore -d swarmcore"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.28.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: swarmcore
      POSTGRES_PWD: swarmcore
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig

  temporal-ui:
    image: temporalio/ui:2.39.0
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8088:8080"

  nats:
    image: nats:2.11.6-alpine
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  opa:
    image: openpolicyagent/opa:1.7.1-static
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    ports:
      - "8181:8181"
    volumes:
      - ./opa:/policies:ro

  vault:
    image: hashicorp/vault:1.20.1
    cap_add: ["IPC_LOCK"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: local-dev-only
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"

  phoenix:
    image: arizephoenix/phoenix:11.13.2
    ports:
      - "6006:6006"
      - "4317:4317"
    volumes:
      - phoenix-data:/root/.phoenix

volumes:
  postgres-data:
  nats-data:
  phoenix-data:
